name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: home_app
          POSTGRES_PASSWORD: home_app
          POSTGRES_DB: home_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_app -d home_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_app_test?sslmode=disable
      BFF_SECRETS: ci-client-secret
      ACCESS_TOKEN_SECRET: ci-access-token-secret-that-is-at-least-32-bytes
      OTP_HASH_SECRET: ci-otp-hash-secret-that-is-at-least-32-bytes
      EMAIL_PROVIDER: development
      EMAIL_FROM: no-reply@example.test
      REPORTING_TIMEZONE: Europe/Istanbul
      SEARCH_ATTRIBUTION_WINDOW_HOURS: "72"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/migrate up
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go run ./cmd/seed
      - run: go run ./cmd/admin-metrics rebuild
