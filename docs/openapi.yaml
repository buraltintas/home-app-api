openapi: 3.1.0
info:
  title: Boşa Gezme! API
  version: 1.0.0
  description: |
    Backend contract for the Boşa Gezme! React Native client and a future Next.js BFF.
    Canonical product domain: https://bosagezme.com
    Every `/v1` operation requires `X-BFF-Secret`. A bearer token is optional
    on discovery reads and required on mutations marked with `bearerAuth`.
    Supported locales are `tr`, `en`, `de`, and `ru`. Resolution order is a valid
    explicit `X-Locale`, authenticated private `preferred_locale`,
    `Accept-Language`, then configured default (`tr`). Regional variants are
    normalized and unsupported values safely fall back. Domain error codes are
    stable; messages are localized.
externalDocs:
  description: Boşa Gezme! product website
  url: https://bosagezme.com
servers:
  - url: http://localhost:8080
security:
  - bffSecret: []
tags:
  - {name: System}
  - {name: Auth}
  - {name: Discovery}
  - {name: Social}
  - {name: Profile}
  - {name: Feedback}
  - {name: Admin}
  - {name: Media}
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses: {'200': {$ref: '#/components/responses/OK'}}
  /ready:
    get:
      tags: [System]
      summary: Database readiness probe
      security: []
      responses: {'200': {$ref: '#/components/responses/OK'}, '503': {$ref: '#/components/responses/Error'}}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus exposition
      description: Requires `X-Metrics-Token` when `METRICS_TOKEN` is configured.
      security: []
      responses: {'200': {description: Prometheus text format}, '401': {description: Invalid metrics token}}
  /media/{id}:
    get:
      tags: [Media]
      summary: Resolve public post media
      description: Redirects to a local URL or a short-lived signed private-object URL. Only ready media attached to a non-deleted post is resolvable. This route does not require the BFF secret.
      security: []
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '307': {description: Temporary redirect, headers: {Location: {schema: {type: string, format: uri}}}}
        '404': {$ref: '#/components/responses/Error'}
  /v1/auth/email/request-code:
    post:
      tags: [Auth]
      summary: Queue an email OTP
      description: Rate limited by normalized email, remote IP and visitor session. The explicitly configured App Review identity receives the same generic response and short-lived attempt-limited code record, but no email is queued.
      requestBody: {$ref: '#/components/requestBodies/EmailRequest'}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/auth/email/verify-code:
    post:
      tags: [Auth]
      summary: Verify OTP and create a session
      requestBody: {$ref: '#/components/requestBodies/EmailVerify'}
      responses: {'200': {$ref: '#/components/responses/TokenPair'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/auth/google:
    post:
      tags: [Auth]
      summary: Verify Google ID token and create a session
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id_token], properties: {id_token: {type: string}}}}}
      responses: {'200': {$ref: '#/components/responses/TokenPair'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}}
      responses: {'200': {$ref: '#/components/responses/TokenPair'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session family
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'204': {description: Revoked}, '401': {$ref: '#/components/responses/Error'}}
  /v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all user sessions
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'204': {description: Revoked}, '401': {$ref: '#/components/responses/Error'}}
  /v1/feed:
    get:
      tags: [Discovery]
      summary: Cursor-paginated review feed
      description: Bearer auth is optional; viewer state is populated when present. Latitude and longitude must be supplied together. With a coordinate pair, reviews are ordered by the viewer's distance to each store; without it they are newest-first. Reuse the same mode and coordinates while paging.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PageLimit50'}
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
      responses: {'200': {$ref: '#/components/responses/Feed'}, '400': {$ref: '#/components/responses/Error'}}
  /v1/locations/search:
    get:
      tags: [Discovery]
      summary: Resolve manually entered city, district, or neighborhood text
      description: Accepts human-readable location text and returns geographic Google Places candidates only. UI must show name/address, never coordinate input fields; returned coordinates are transport-only discovery context and never visit verification evidence.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 120}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 5}}
      responses: {'200': {description: Geographic candidates, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/LocationResult'}}}}}}}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/search:
    post:
      tags: [Discovery]
      summary: Hybrid internal, OpenAI-intent and Google Places search
      description: Bearer auth is optional. Anonymous callers should persist `visitor_session_id`.
      requestBody: {$ref: '#/components/requestBodies/Search'}
      responses: {'200': {$ref: '#/components/responses/Search'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/stores/search:
    get:
      tags: [Discovery]
      summary: Classic internal store search
      parameters: &storeSearchParameters
        - {name: q, in: query, description: Empty means nearby/all; otherwise at least two Unicode characters., schema: {type: string, maxLength: 500}}
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radius_meters, in: query, schema: {type: integer, minimum: 100, maximum: 50000, default: 10000}}
        - {$ref: '#/components/parameters/PageLimit50'}
      responses: {'200': {$ref: '#/components/responses/StoreSearch'}, '400': {$ref: '#/components/responses/Error'}}
  /v1/stores/nearby:
    get:
      tags: [Discovery]
      summary: Nearby internal stores
      parameters: *storeSearchParameters
      responses: {'200': {$ref: '#/components/responses/StoreSearch'}, '400': {$ref: '#/components/responses/Error'}}
  /v1/stores/resolve-external:
    post:
      tags: [Discovery]
      summary: Materialize a verified Google Place as one internal store
      security: [{bffSecret: [], bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [provider, place_id], properties: {provider: {const: google}, place_id: {type: string}}}}}
      responses: {'200': {$ref: '#/components/responses/ID'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/stores/{id}:
    get:
      tags: [Discovery]
      summary: Store detail and recent reviews
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
      responses: {'200': {$ref: '#/components/responses/StoreDetail'}, '404': {$ref: '#/components/responses/Error'}}
  /v1/stores/{id}/posts:
    get:
      tags: [Discovery]
      summary: Reviews for a store
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PageLimit50'}]
      responses: {'200': {$ref: '#/components/responses/PostList'}}
  /v1/stores/{id}/visit-verifications:
    post:
      tags: [Social]
      summary: Verify a physical store visit for one later review
      description: Uses fresh OS coordinates and horizontal accuracy. The backend requires device-to-store distance plus accuracy to stay within the configured review radius, stores no raw device coordinates, and returns a single-use expiring verification. Manual/profile discovery location is never accepted as evidence.
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {$ref: '#/components/requestBodies/VisitVerification'}
      responses: {'201': {description: Visit verified, content: {application/json: {schema: {$ref: '#/components/schemas/VisitVerification'}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/stores/{id}/favorite:
    post:
      tags: [Social]
      summary: Favorite a store idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Favorite exists}, '401': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Social]
      summary: Remove a favorite idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Favorite absent}}
  /v1/posts:
    post:
      tags: [Social]
      summary: Create a proximity-verified store review
      description: Physical presence uses fresh mobile OS location or a previously issued single-use visit proof. Manual/profile discovery coordinates are never valid evidence; the configured review radius includes reported accuracy.
      security: [{bffSecret: [], bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Post'}
      responses: {'201': {$ref: '#/components/responses/ID'}, '400': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/posts/{id}:
    get:
      tags: [Discovery]
      summary: Review detail
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {$ref: '#/components/responses/Post'}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Social]
      summary: Soft-delete an owned review
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/Error'}}
  /v1/posts/{id}/like:
    post:
      tags: [Social]
      summary: Like a review idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Like exists}}
    delete:
      tags: [Social]
      summary: Remove a like idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Like absent}}
  /v1/posts/{id}/comments:
    get:
      tags: [Discovery]
      summary: Review comments
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/CommentList'}}
    post:
      tags: [Social]
      summary: Add a comment
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 2000}, content_language: {$ref: '#/components/schemas/Locale'}}}}}
      responses: {'201': {$ref: '#/components/responses/ID'}}
  /v1/comments/{id}:
    delete:
      tags: [Social]
      summary: Soft-delete an owned comment
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/Error'}}
  /v1/users/{id}:
    get:
      tags: [Profile]
      summary: Public user profile
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {$ref: '#/components/responses/PublicProfile'}, '404': {$ref: '#/components/responses/Error'}}
  /v1/users/{id}/posts:
    get:
      tags: [Profile]
      summary: Public user reviews
      parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/PageLimit50'}]
      responses: {'200': {$ref: '#/components/responses/PostList'}}
  /v1/users/{id}/follow:
    post:
      tags: [Social]
      summary: Follow a user idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Follow exists}, '422': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Social]
      summary: Unfollow a user idempotently
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Follow absent}}
  /v1/searches/{id}/interactions:
    post:
      tags: [Discovery]
      summary: Record an ownership-bound search interaction
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                search_result_id: {type: [string, 'null'], format: uuid}
                event_type: {type: string, enum: [result_impression, result_click, store_open, favorite, unfavorite, review_started, review_created, share]}
                idempotency_key: {type: string}
      responses: {'204': {description: Recorded or already present}, '404': {$ref: '#/components/responses/Error'}}
  /v1/me:
    get:
      tags: [Profile]
      summary: Private profile
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Me'}}
    patch:
      tags: [Profile]
      summary: Update public/private profile fields
      security: [{bffSecret: [], bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_locale: {$ref: '#/components/schemas/Locale'}
                bio_language: {$ref: '#/components/schemas/Locale'}
                display_name: {type: string, maxLength: 100}
                avatar_url: {type: string, format: uri, maxLength: 2048}
                bio: {type: string, maxLength: 500, description: Original user content; never automatically translated.}
                city: {type: string, maxLength: 100}
                relationship_status: {type: [string, 'null'], maxLength: 40}
                has_children: {type: [boolean, 'null']}
                children_age_ranges: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
                housing_status: {type: [string, 'null'], enum: [owner, renter, living_with_family, other, null]}
                occupation: {type: [string, 'null'], maxLength: 100}
                age_range: {type: [string, 'null'], maxLength: 40}
                home_style_interests: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
              additionalProperties: false
      responses: {'200': {$ref: '#/components/responses/Me'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Profile]
      summary: Privacy-purge and deactivate the account
      description: Permanently removes profile, history, content and social data, revokes sessions, and leaves only the verified login identity required to reactivate the same user ID. A later verified login creates a blank active profile; purged data is never restored.
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'204': {description: Purged and deactivated}}
  /v1/me/discovery-location:
    put:
      tags: [Profile]
      summary: Persist the authenticated user's private discovery location
      description: Manual selection accepts only a Google geographic place ID; the backend resolves its coordinates. Device coordinates come from OS geolocation and always replace a previously persisted manual fallback.
      security: [{bffSecret: [], bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [source, place_id]
                  properties:
                    source: {type: string, const: manual}
                    place_id: {type: string, minLength: 1, maxLength: 300}
                  additionalProperties: false
                - type: object
                  required: [source, latitude, longitude, accuracy_meters]
                  properties:
                    source: {type: string, const: device}
                    latitude: {type: number, minimum: -90, maximum: 90, description: OS-produced; never user-entered.}
                    longitude: {type: number, minimum: -180, maximum: 180, description: OS-produced; never user-entered.}
                    accuracy_meters: {type: number, exclusiveMinimum: 0, maximum: 1000}
                  additionalProperties: false
      responses: {'200': {$ref: '#/components/responses/Me'}, '400': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
    delete:
      tags: [Profile]
      summary: Clear the authenticated user's private discovery location
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'204': {description: Cleared}}
  /v1/me/messages:
    get:
      tags: [Profile, Feedback]
      summary: Feedback sent by the authenticated user and private administrator replies
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Messages newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: '#/components/schemas/FeedbackMessage'}}}
  /v1/feedback:
    post:
      tags: [Feedback]
      summary: Send private product feedback, anonymously or while signed in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                kind: {type: string, enum: [suggestion, problem, praise, other]}
                message: {type: string, minLength: 5, maxLength: 4000}
                contact_email: {type: string, format: email, maxLength: 320}
      responses: {'204': {description: Recorded}, '422': {$ref: '#/components/responses/Error'}}
  /v1/admin/feedback/{id}/reply:
    post:
      tags: [Admin, Feedback]
      summary: Privately reply to feedback owned by a signed-in user
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [message], properties: {message: {type: string, minLength: 1, maxLength: 4000}}}}}
      responses: {'204': {description: Reply stored and feedback closed}, '422': {$ref: '#/components/responses/Error'}}
  /v1/me/searches:
    get:
      tags: [Profile]
      summary: User search history
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/SearchHistory'}}
    delete:
      tags: [Profile]
      summary: Delete all user search history
      security: [{bffSecret: [], bearerAuth: []}]
      responses: {'204': {description: Deleted}}
  /v1/me/searches/{id}:
    delete:
      tags: [Profile]
      summary: Delete one owned search record
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/Error'}}
  /v1/media/uploads:
    post:
      tags: [Media]
      summary: Create an authorized image upload
      security: [{bffSecret: [], bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [mime_type, size_bytes], properties: {mime_type: {type: string, enum: [image/jpeg, image/png, image/webp]}, size_bytes: {type: integer, minimum: 1}}}}}
      responses: {'201': {$ref: '#/components/responses/MediaUpload'}, '400': {$ref: '#/components/responses/Error'}}
  /v1/media/{id}/complete:
    post:
      tags: [Media]
      summary: Verify and finalize an owned uploaded image
      security: [{bffSecret: [], bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [width, height], properties: {width: {type: integer, minimum: 1, maximum: 20000}, height: {type: integer, minimum: 1, maximum: 20000}}}}}
      responses: {'204': {description: Ready}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bffSecret: {type: apiKey, in: header, name: X-BFF-Secret}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
    PageLimit50: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque `created_at + id` cursor}
    LocaleHeader: {name: X-Locale, in: header, required: false, schema: {$ref: '#/components/schemas/Locale'}, description: Explicit presentation locale; overrides authenticated preference and Accept-Language.}
  requestBodies:
    EmailRequest:
      required: true
      content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}
    EmailVerify:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: false, required: [email, code], properties: {email: {type: string, format: email}, code: {type: string, pattern: '^[0-9]{6}$'}}}}}
    Search:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [query]
            properties:
              query: {type: string, minLength: 2, maxLength: 500}
              latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
              longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
              radius_meters: {type: integer, minimum: 100, maximum: 50000, default: 10000}
    Post:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [store_id, text, rating]
            oneOf:
              - required: [latitude, longitude, accuracy_meters]
              - required: [visit_verification_id]
            properties:
              store_id: {type: string, format: uuid}
              text: {type: string, minLength: 3, maxLength: 5000}
              rating: {type: integer, minimum: 1, maximum: 5}
              latitude: {type: number, minimum: -90, maximum: 90}
              longitude: {type: number, minimum: -180, maximum: 180}
              accuracy_meters: {type: number, exclusiveMinimum: 0, maximum: 1000, description: Required OS horizontal accuracy; the configured maximum defaults to 1000 m and accuracy is added conservatively to store distance.}
              visit_verification_id: {type: string, format: uuid, description: Single-use unexpired verification previously issued for this user and store.}
              media_ids: {type: array, maxItems: 10, uniqueItems: true, items: {type: string, format: uuid}}
              origin_search_id: {type: [string, 'null'], format: uuid}
              origin_search_result_id: {type: [string, 'null'], format: uuid}
              content_language: {$ref: '#/components/schemas/Locale', description: Optional language metadata; content is stored unchanged.}
    VisitVerification:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [latitude, longitude, accuracy_meters]
            properties:
              latitude: {type: number, minimum: -90, maximum: 90}
              longitude: {type: number, minimum: -180, maximum: 180}
              accuracy_meters: {type: number, exclusiveMinimum: 0}
  schemas:
    Locale: {type: string, enum: [tr, en, de, ru]}
    FeedbackMessage:
      type: object
      required: [id, kind, message, status, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [suggestion, problem, praise, other]}
        message: {type: string}
        status: {type: string, enum: [new, read, handled]}
        created_at: {type: string, format: date-time}
        reply: {type: string}
        replied_at: {type: string, format: date-time}
    LocationResult:
      type: object
      required: [provider, place_id, name, address, latitude, longitude, types, attributions]
      properties:
        provider: {const: google}
        place_id: {type: string}
        name: {type: string}
        address: {type: string}
        latitude: {type: number, minimum: -90, maximum: 90, description: Transport-only resolved value; never shown as a manual user input.}
        longitude: {type: number, minimum: -180, maximum: 180, description: Transport-only resolved value; never shown as a manual user input.}
        types: {type: array, items: {type: string}}
        attributions: {type: array, items: {type: string}}
    VisitVerification:
      type: object
      required: [id, store_id, distance_meters, verified_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        distance_meters: {type: number, minimum: 0}
        store_distance_meters: {type: number, minimum: 0, description: Viewer-to-store distance; present only when feed coordinates were supplied. Distinct from visit-verification distance_meters.}
        verified_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string, description: Stable language-independent machine code.}, message: {type: string, description: Localized using the resolved request locale.}}
        request_id: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at, user_id]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {const: Bearer}
        access_expires_at: {type: string, format: date-time}
        refresh_expires_at: {type: string, format: date-time}
        user_id: {type: string, format: uuid}
    MediaAsset:
      type: object
      required: [id, url, mime_type, width, height]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: API-relative stable media URL; resolve against the backend origin.}
        mime_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    StorePhoto:
      type: object
      required: [source]
      description: The single effective store image. An administrator upload wins; Google is the fallback.
      properties:
        source: {type: string, enum: [admin, google]}
        media_id: {type: string, format: uuid, description: Present when source is admin.}
        name: {type: string, description: Google Places photo resource name; present when source is google.}
        attributions: {type: array, items: {type: string}}
    Post:
      type: object
      required: [id, user_id, store_id, text, rating, visit_verified, distance_meters, created_at, display_name, avatar_url, store_name, store_city, store_district, media, like_count, comment_count, viewer_has_liked, viewer_follows_author, viewer_has_favorited_store]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        text: {type: string}
        content_language: {$ref: '#/components/schemas/Locale'}
        rating: {type: integer, minimum: 1, maximum: 5}
        visit_verified: {type: boolean, const: true}
        distance_meters: {type: number, minimum: 0}
        created_at: {type: string, format: date-time}
        display_name: {type: string}
        avatar_url: {type: string}
        store_name: {type: string}
        store_city: {type: string}
        store_district: {type: string}
        store_photo: {$ref: '#/components/schemas/StorePhoto'}
        media: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/MediaAsset'}}
        like_count: {type: integer, minimum: 0}
        comment_count: {type: integer, minimum: 0}
        viewer_has_liked: {type: boolean}
        viewer_follows_author: {type: boolean}
        viewer_has_favorited_store: {type: boolean}
    Comment:
      type: object
      required: [id, user_id, body, display_name, avatar_url, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        body: {type: string}
        content_language: {$ref: '#/components/schemas/Locale'}
        display_name: {type: string}
        avatar_url: {type: string}
        created_at: {type: string, format: date-time}
    StoreStats:
      type: object
      required: [average_rating, rating_count, review_count, favorite_count, post_count]
      properties:
        average_rating: {type: number, minimum: 0, maximum: 5}
        rating_count: {type: integer, minimum: 0}
        review_count: {type: integer, minimum: 0}
        favorite_count: {type: integer, minimum: 0}
        post_count: {type: integer, minimum: 0}
    ExternalSource:
      type: object
      required: [provider, external_id, attribution]
      properties:
        provider: {type: string, enum: [google]}
        external_id: {type: string}
        attribution: {type: object, additionalProperties: true}
        refreshed_at: {type: string, format: date-time}
    Store:
      type: object
      required: [id, name, slug, is_catalog_store, address, city, district, latitude, longitude, categories, category_labels, platform, viewer_has_favorited, viewer_has_reviewed]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        is_catalog_store: {type: boolean, description: Editorial catalogue marker; does not affect ranking or paid placement.}
        brand_name: {type: string}
        address: {type: string}
        city: {type: string}
        district: {type: string}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        distance_meters: {type: number, minimum: 0}
        categories: {type: array, items: {type: string}}
        category_labels: {type: array, items: {type: string}}
        localized_description: {type: string}
        platform: {$ref: '#/components/schemas/StoreStats'}
        viewer_has_favorited: {type: boolean}
        viewer_has_reviewed: {type: boolean}
        photo: {$ref: '#/components/schemas/StorePhoto'}
        external_sources: {type: array, items: {$ref: '#/components/schemas/ExternalSource'}}
    SearchIntent:
      type: object
      required: [scope, query_language, normalized_query, store_name, location_text, categories, product_terms, style_terms, price_intent, attributes, sort_preference, semantic_terms]
      properties:
        scope: {type: string, enum: [home_living, out_of_scope, unclear]}
        query_language: {$ref: '#/components/schemas/Locale'}
        normalized_query: {type: string}
        store_name: {type: string, maxLength: 160, description: Extracted home/living store or brand name; empty when absent.}
        location_text: {type: string}
        categories: {type: array, items: {type: string}}
        product_terms: {type: array, items: {type: string}}
        style_terms: {type: array, items: {type: string}}
        price_intent: {type: string, enum: ['', budget, midrange, premium]}
        attributes: {type: array, items: {type: string}}
        sort_preference: {type: string, enum: ['', relevance, distance, rating, popularity]}
        semantic_terms: {type: array, items: {type: string}}
    SearchResult:
      type: object
      required: [search_result_impression_id, source, name, address, latitude, longitude, categories]
      properties:
        id: {type: string, format: uuid, description: Missing for a google-only result.}
        search_result_impression_id: {type: string, format: uuid}
        source: {type: string, enum: [internal, google, google+platform]}
        name: {type: string}
        address: {type: string}
        city: {type: string}
        district: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        distance_meters: {type: number, minimum: 0}
        categories: {type: array, items: {type: string}}
        catalog_store: {type: boolean, description: Present and true for an editorial catalogue store; does not affect ranking.}
        photo: {$ref: '#/components/schemas/StorePhoto'}
        platform:
          type: object
          required: [store_id, average_rating, review_count, favorite_count, post_count]
          properties:
            store_id: {type: string, format: uuid}
            average_rating: {type: number}
            review_count: {type: integer}
            favorite_count: {type: integer}
            post_count: {type: integer}
        google:
          type: object
          required: [provider, place_id, rating, rating_count]
          properties:
            provider: {const: google}
            place_id: {type: string}
            rating: {type: number}
            rating_count: {type: integer}
    SearchResponse:
      type: object
      required: [search_id, intent, results]
      properties:
        search_id: {type: string, format: uuid}
        visitor_session_id: {type: string, format: uuid}
        intent: {$ref: '#/components/schemas/SearchIntent'}
        results: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/SearchResult'}}
        guidance:
          type: object
          description: Present only when the query is outside home/living or cannot be understood. Providers are not queried and results is empty.
          required: [code, reason, message, examples]
          properties:
            code: {const: HOME_LIVING_ONLY}
            reason: {type: string, enum: [out_of_scope, unclear]}
            message: {type: string}
            examples: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
        fallback_state: {type: string, description: Comma-joined provider degradation markers., examples: [ai_unavailable_or_invalid, places_unavailable, 'ai_unavailable_or_invalid,places_unavailable']}
    StoreSearchResponse:
      type: object
      required: [search_id, items]
      properties:
        search_id: {type: string, format: uuid}
        visitor_session_id: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/Store'}}
    SearchHistoryItem:
      type: object
      required: [id, raw_query, intent, created_at, result_count]
      properties:
        id: {type: string, format: uuid}
        raw_query: {type: string}
        intent: {$ref: '#/components/schemas/SearchIntent'}
        created_at: {type: string, format: date-time}
        result_count: {type: integer, minimum: 0}
    PublicProfile:
      type: object
      required: [id, display_name, avatar_url, bio, city, follower_count, following_count, post_count]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        avatar_url: {type: string}
        bio: {type: string}
        bio_language: {$ref: '#/components/schemas/Locale'}
        city: {type: string}
        follower_count: {type: integer, minimum: 0}
        following_count: {type: integer, minimum: 0}
        post_count: {type: integer, minimum: 0}
    DiscoveryLocation:
      type: object
      description: Private discovery preference. Coordinates are transport-only and must never be rendered, logged, or used as visit-verification evidence.
      required: [source, label, address, latitude, longitude, updated_at]
      properties:
        source: {type: string, enum: [device, manual]}
        label: {type: string, description: Empty for device mode; clients render localized current-location copy.}
        address: {type: string}
        place_id: {type: string}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        accuracy_meters: {type: number, exclusiveMinimum: 0, maximum: 1000}
        updated_at: {type: string, format: date-time}
    Me:
      allOf:
        - {$ref: '#/components/schemas/PublicProfile'}
        - type: object
          required: [email, relationship_status, has_children, children_age_ranges, housing_status, occupation, age_range, home_style_interests, preferred_locale, discovery_location]
          properties:
            email: {type: string, format: email}
            relationship_status: {type: [string, 'null']}
            has_children: {type: [boolean, 'null']}
            children_age_ranges: {type: array, items: {type: string}}
            housing_status: {type: [string, 'null'], enum: [owner, renter, living_with_family, other, null]}
            occupation: {type: [string, 'null']}
            age_range: {type: [string, 'null']}
            home_style_interests: {type: array, items: {type: string}}
            preferred_locale: {$ref: '#/components/schemas/Locale'}
            discovery_location:
              oneOf:
                - {$ref: '#/components/schemas/DiscoveryLocation'}
                - {type: 'null'}
    MediaUpload:
      type: object
      required: [id, upload]
      properties:
        id: {type: string, format: uuid}
        upload:
          type: object
          required: [storage_key, upload_url, headers, expires_at]
          properties:
            storage_key: {type: string}
            upload_url: {type: string, format: uri}
            headers: {type: object, additionalProperties: {type: string}}
            expires_at: {type: string, format: date-time}
  responses:
    OK: {description: OK, content: {application/json: {schema: {type: object}}}}
    Accepted: {description: Accepted, content: {application/json: {schema: {type: object}}}}
    JSON: {description: Success, content: {application/json: {schema: {type: object}}}}
    ID: {description: Success, content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string, format: uuid}}}}}}
    TokenPair: {description: Session created or rotated, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
    Feed: {description: Feed page, content: {application/json: {schema: {type: object, required: [items, next_cursor], properties: {items: {type: array, items: {$ref: '#/components/schemas/Post'}}, next_cursor: {type: string}}}}}}
    PostList: {description: Post list, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Post'}}}}}}}
    Post: {description: Post detail, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
    CommentList: {description: Comment list ordered oldest first, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}}}}
    StoreDetail: {description: Store detail, content: {application/json: {schema: {type: object, required: [store, recent_posts], properties: {store: {$ref: '#/components/schemas/Store'}, recent_posts: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/Post'}}}}}}}
    Search: {description: Hybrid search response, content: {application/json: {schema: {$ref: '#/components/schemas/SearchResponse'}}}}
    StoreSearch: {description: Classic internal search response, content: {application/json: {schema: {$ref: '#/components/schemas/StoreSearchResponse'}}}}
    SearchHistory: {description: Private search history, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SearchHistoryItem'}}}}}}}
    PublicProfile: {description: Public profile, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProfile'}}}}
    Me: {description: Private profile, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
    MediaUpload: {description: Authorized direct upload, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
    Error: {description: Domain error; raw database/provider errors are never returned, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
