# The brand registry.
#
# This file is the list of Turkish home and living chains whose own published store lists
# this catalogue is built from. It is data, not code: adding a chain is a block here plus
# one look at its store locator, never a new Go file.
#
# tier decides import order, and order is part of deduplication -- the largest chains are
# imported first so that smaller ones and independents match onto rows that are already
# settled rather than creating twins beside them.
#
#   tier 1  national chains, hundreds of shops
#   tier 2  national but smaller, or a single strong category
#   tier 3  regional chains and large independents
#
# locator: none  means the store list has not been mapped yet. Such a brand is still
# registered -- its name and website are useful on their own, and it is how the work that
# remains stays visible instead of living in somebody's head.
#
# categories must be slugs from store_categories: bedding, carpet, curtain, decoration,
# furniture, garden, home_accessories, home_textile, household, kitchenware, lighting,
# major_appliances, small_appliances, tableware, bathroom.

brands:
  - slug: english-home
    name: English Home
    website: https://www.englishhome.com
    tier: 1
    categories: [home_textile, decoration, kitchenware, tableware, home_accessories, bedding]
    store_count_estimate: 600
    locator:
      kind: json
      # The page a customer sees calls this endpoint; robots.txt allows it and forbids the
      # per-store pages beside it, which this fetcher therefore never asks for.
      url: https://www.englishhome.com/api/Store/GetStoriesLite?CountryID=1&CityID=null&PageNo=1&PageSize=2000
      list: magazalar
      id: id
      name: tanim
      address: adres
      city: il
      district: ilce
      phone: telefon
      latitude: latitude
      longitude: longitude
      # Branch names are published as internal codes -- "ANK ACITY AVM" -- so the chain's
      # own name goes in front of them or no one would recognise the shop.

  - slug: madame-coco
    name: Madame Coco
    website: https://www.madamecoco.com
    tier: 1
    categories: [home_textile, decoration, kitchenware, tableware, home_accessories]
    store_count_estimate: 450
    locator:
      kind: json
      # Akinon's commerce platform, which several Turkish chains run on: the locator page
      # answers with JSON when asked for it, and the shape is the same for all of them.
      url: https://www.madamecoco.com/magazalar
      list: results
      id: pk
      name: name
      address: address
      # The place is published as a nested object: the township holds the district's name
      # and, under it, the city's. Dotted paths read it where it actually is; the flat
      # fields beside it are empty, and reading those left every row placeless.
      city: township.city.name
      district: township.name
      phone: phone_number
      image: image
      latitude: latitude
      longitude: longitude
      # Branch names are published as places -- "Adana Ceyhan Cadde" -- with no chain name
      # in them at all.

  - slug: karaca-home
    name: Karaca Home
    website: https://www.karaca.com
    tier: 1
    categories: [home_textile, bedding, kitchenware, tableware]
    store_count_estimate: 300
    locator:
      kind: json
      # Karaca renders its list into the page rather than serving it: each shop is a JSON
      # object in its own hidden div. "state" is the district; the province is in "city".
      url: https://www.karaca.com/magazalarimiz
      extract: 'class="store-find-change-map\d+">(\{.*?\})</div>'
      id: store_id
      name: name
      address: address
      city: city
      district: state
      phone: phone
      latitude: lat
      longitude: lng

  - slug: bellona
    name: Bellona
    website: https://www.bellona.com.tr
    tier: 1
    categories: [furniture, bedding, home_textile]
    store_count_estimate: 700
    locator:
      kind: json
      # Erciyes Holding publishes its chains' dealer networks through one API, one
      # province at a time -- which is what the store page itself does when a customer
      # picks a province from its dropdown. Its robots.txt allows us and signals
      # "search=yes, use=reference", which is what this catalogue is.
      url: https://brandapi.erciyes.com/api/FirmApi/GetProvBrFirms?Brand=BELLONA&Code={province}&District=
      id: Id
      name: FirmName
      address: Adres
      city: Province
      district: District
      phone: Telephone
      latitude: Latitude
      longitude: Longitude
      # These are dealerships trading under their own signs, so the chain's name goes in
      # front: "Ahsen Mobilya" alone tells nobody it is where you buy an İstikbal bed.

  - slug: istikbal
    name: İstikbal
    website: https://www.istikbal.com.tr
    tier: 1
    categories: [furniture, bedding, home_textile]
    store_count_estimate: 800
    locator:
      kind: json
      url: https://brandapi.erciyes.com/api/FirmApi/GetProvBrFirms?Brand=%C4%B0ST%C4%B0KBAL&Code={province}&District=
      id: Id
      name: FirmName
      address: Adres
      city: Province
      district: District
      phone: Telephone
      latitude: Latitude
      longitude: Longitude
      # These are dealerships trading under their own signs, so the chain's name goes in
      # front: "Ahsen Mobilya" alone tells nobody it is where you buy an İstikbal bed.

  - slug: mondi
    name: Mondi
    website: https://www.mondi.com.tr
    tier: 1
    categories: [furniture, bedding]
    store_count_estimate: 250
    locator:
      kind: json
      url: https://brandapi.erciyes.com/api/FirmApi/GetProvBrFirms?Brand=MOND%C4%B0&Code={province}&District=
      id: Id
      name: FirmName
      address: Adres
      city: Province
      district: District
      phone: Telephone
      latitude: Latitude
      longitude: Longitude
      # These are dealerships trading under their own signs, so the chain's name goes in
      # front: "Ahsen Mobilya" alone tells nobody it is where you buy an İstikbal bed.

  - slug: dogtas
    name: Doğtaş
    website: https://www.dogtas.com
    tier: 1
    categories: [furniture, bedding]
    store_count_estimate: 300
    locator:
      kind: json
      # Doğtaş and Kelebek share a dealer panel, so one mapping covers both: the whole
      # network comes back in one request, with the town as a nested object and the point
      # as a single "lat, lon" string.
      url: https://services.dmgpanel.com/ajax/new-shops?mark=dogtas&zone=
      list: shops
      id: id
      name: name
      address: address
      city: city.name
      district: district.name
      phone: phone_number
      coordinates: google_maps_link

  - slug: kelebek-mobilya
    name: Kelebek Mobilya
    website: https://www.kelebek.com
    tier: 1
    categories: [furniture, bedding]
    store_count_estimate: 200
    locator:
      kind: json
      url: https://services.dmgpanel.com/ajax/new-shops?mark=kelebek&zone=
      list: shops
      id: id
      name: name
      address: address
      city: city.name
      district: district.name
      phone: phone_number
      coordinates: google_maps_link

  - slug: cilek
    name: Çilek
    website: https://www.cilek.com
    tier: 1
    categories: [furniture, bedding]
    store_count_estimate: 250
    locator:
      kind: json
      # Two steps and both of them POSTs: ask which provinces exist in Türkiye (the
      # publisher's country 223), then ask each province for its shops. "city_category" is
      # the province; "city_name" is the branch.
      method: post
      over:
        url: https://store.cilek.com/location/getstates
        method: post
        body: countryID=223
        field: state_id
      url: https://store.cilek.com/location/getcities
      body: stateID={over}
      id: city_id
      name: city_name
      address: city_address
      city: city_category
      phone: city_phone
      latitude: city_latitude
      longitude: city_longitude

  - slug: yatas-bedding
    name: Yataş Bedding
    website: https://www.yatasbedding.com.tr
    tier: 1
    categories: [bedding, home_textile, furniture]
    store_count_estimate: 600
    locator:
      kind: json
      # Yataş publishes its own network and Enza Home's in one list, across two addresses
      # that mostly but not entirely overlap, marking each row with the chain's code. Both
      # are fetched and pooled; the marker decides which chain a shop belongs to, which is
      # the publisher telling us rather than us guessing.
      urls:
        - https://api.yatas.com.tr/occ/v2/yatas/stores?fields=FULL&pageSize=2000
        - https://api.yatas.com.tr/occ/v2/enza/stores?fields=FULL&pageSize=2000
      list: stores
      id: name
      name: displayName
      address: address.streetname
      city: address.city.name
      district: address.county.name
      latitude: geoPoint.latitude
      longitude: geoPoint.longitude
      require: '(^| )YB( |$)'

  - slug: ikea
    name: IKEA
    website: https://www.ikea.com.tr
    tier: 1
    categories: [furniture, decoration, kitchenware, home_textile, lighting, bedding]
    store_count_estimate: 12
    locator:
      kind: html
      # Each location is a block on one page, carrying its point in data attributes with a
      # comma for the decimal separator, which is how these are written in Turkish.
      url: https://www.ikea.com.tr/magazalar
      row: '(?s)<div class="malls-city-item"(.*?)</div>'
      id: 'href="/magazalar/([a-z0-9-]+)"'
      name: '<h4><a[^>]*>([^<]+)</a>'
      latitude: 'data-latitude="([0-9.,]+)"'
      longitude: 'data-longitude="([0-9.,]+)"'

  - slug: koctas
    name: Koçtaş
    website: https://www.koctas.com.tr
    tier: 1
    categories: [household, garden, bathroom, lighting, kitchenware]
    store_count_estimate: 60
    locator: {kind: none}

  - slug: tepe-home
    name: Tepe Home
    website: https://www.tepehome.com.tr
    tier: 1
    categories: [furniture, decoration, home_textile, home_accessories]
    store_count_estimate: 40
    locator:
      kind: json
      # Tepe Home renders its list into the page as preloaded state rather than serving it
      # from an endpoint. The marker points at the array; the adapter counts brackets to
      # find its end, which a regular expression cannot do.
      url: https://www.tepehome.com.tr/magazalar
      extract_after: '"items":'
      id: id
      name: name
      address: line
      city: city
      district: district
      latitude: latitude
      longitude: longitude

  - slug: ozdilek-home
    name: Özdilek Home
    website: https://www.ozdilek.com.tr
    tier: 1
    categories: [home_textile, bedding, decoration, kitchenware]
    store_count_estimate: 150
    locator:
      kind: html
      # Özdilek renders its list into the page with no endpoint behind it: name, address and
      # telephone per shop, and no coordinate -- so each shop is placed at the centre of the
      # town its address names, and the row records that that is where the point came from.
      urls:
        - https://www.ozdilek.com.tr/tr/ev-tekstili-magazalari
        - https://www.ozdilek.com.tr/tr/departman-magazalar
      row: '(?s)<li class="merkezz">(.*?)</ul>'
      id: 'href="/tr/[^"]*/([a-z0-9-]+)"'
      name: 'title="[^"]*">([^<]+)</a>'
      address: '(?s)<li class="mbd">([^<]+)</li>'
      phone: '(?s)tel:[0-9]+"[^>]*></a>([^<]+)'

  - slug: mudo-concept
    name: Mudo Concept
    website: https://www.mudo.com.tr
    tier: 1
    categories: [decoration, home_accessories, home_textile, tableware]
    store_count_estimate: 130
    locator:
      kind: json
      # Akinon's commerce platform, which several Turkish chains run on: the locator page
      # answers with JSON when asked for it, and the shape is the same for all of them.
      url: https://www.mudo.com.tr/stores
      list: results
      id: pk
      name: name
      address: address
      # The place is published as a nested object: the township holds the district's name
      # and, under it, the city's. Dotted paths read it where it actually is; the flat
      # fields beside it are empty, and reading those left every row placeless.
      city: township.city.name
      district: township.name
      phone: phone_number
      image: image
      latitude: latitude
      longitude: longitude

  - slug: linens
    name: Linens
    website: https://www.linens.com.tr
    tier: 1
    categories: [home_textile, bedding, decoration]
    store_count_estimate: 100
    locator:
      kind: json
      # Linens and Taç run the same commerce platform, so one mapping covers both: the
      # whole country in one request, filtered to Türkiye by countryId. The publisher
      # spells its longitude field "longtitude"; the field name is theirs to choose.
      url: https://www.linens.com.tr/api/inventory/inventoryGetStoreFilter?countryId=1&cityId=0&countyId=0&storeType=0
      list: data
      id: id
      name: name
      address: address
      city: city
      district: county
      phone: phone
      latitude: latitude
      longitude: longtitude

  - slug: tac
    name: Taç
    website: https://www.tac.com.tr
    tier: 1
    categories: [home_textile, bedding, curtain]
    store_count_estimate: 200
    locator:
      kind: json
      url: https://www.tac.com.tr/api/inventory/inventoryGetStoreFilter?countryId=1&cityId=0&countyId=0&storeType=0
      list: data
      id: id
      name: name
      address: address
      city: city
      district: county
      phone: phone
      latitude: latitude
      longitude: longtitude

  - slug: deco-home
    name: Deco Home
    website: https://www.decohome.com.tr
    tier: 1
    categories: [home_textile, bedding, decoration]
    store_count_estimate: 80
    locator: {kind: none}

  - slug: vivense
    name: Vivense
    website: https://www.vivense.com
    tier: 1
    categories: [furniture, decoration, home_textile]
    store_count_estimate: 20
    locator:
      kind: html
      # Vivense's showroom page carries a JavaScript array of points with no names, which is
      # easy to find and useless; the shops themselves are in the markup below it, each with
      # its name, province, address and its own coordinate attribute.
      url: https://www.vivense.com/mobilya-showroom.html
      row: '(?s)(showroom-coordinate="[^"]+"[^>]*>.*?<p class="address">[^<]*)'
      name: '(?s)listen-map-[0-9]+[^>]*>\s*(?:<p class="vvns-showroom-in-corner-head">\s*)?([^<\n]+)'
      city: '(?s)<span>\s*([^<]+?)\s*</span>'
      address: '(?s)<p class="address">\s*([^<]+)'
      coordinates: 'showroom-coordinate="([^"]+)"'

  - slug: boyner-ev
    # Not a store network of its own: "Boyner Ev" is a department inside Boyner's
    # department stores. Importing their branches would fill a home and living catalogue
    # with clothing shops, which is what the apparel filter exists to prevent.
    active: false
    name: Boyner Ev
    website: https://www.boyner.com.tr
    tier: 1
    categories: [home_textile, decoration, tableware, home_accessories]
    store_count_estimate: 100
    locator: {kind: none}

  - slug: chakra
    name: Chakra
    website: https://www.chakra.com.tr
    tier: 2
    categories: [home_textile, decoration, home_accessories]
    locator:
      kind: html
      # Chakra carries each shop's point on the button that opens it in a map, and its town
      # and province in a block under the address.
      url: https://www.chakra.com.tr/magazalar
      row: '(?s)<div id="[0-9]+" class="stores__list-stores js-stores-item">(.*?)data-latitude="[0-9.]+"'
      id: 'title="([^"]+)"'
      name: 'title="([^"]+)"'
      address: '(?s)<div class="stores__address">\s*([^<]+)'
      district: '(?s)<div class="stores__city">\s*([^<]+?)\s*/'
      city: '(?s)/\s*([^<]+?)\s*</div>'
      phone: '(?s)js-stores-phone">\s*([^<]+)'
      latitude: 'daddr=([0-9.]+),'
      longitude: 'daddr=[0-9.]+,([0-9.]+)'

  - slug: pasabahce
    name: Paşabahçe
    website: https://www.pasabahcemagazalari.com
    tier: 2
    categories: [tableware, kitchenware, decoration]
    locator:
      kind: json
      # The same commerce platform as Madame Coco and Mudo Concept: the town is a nested
      # object holding the district's name and, under it, the city's.
      url: https://www.pasabahce.com/api/client/address/retail_store/
      list: results
      id: pk
      name: name
      address: address
      city: township.city.name
      district: township.name
      phone: phone_number
      latitude: latitude
      longitude: longitude

  - slug: zara-home
    # Answers 403 to our bot for every page and serves no robots.txt at all, alone among
    # the chains here. Reading it through a browser would mean presenting ourselves as a
    # different client, and the result could not be refreshed by the import that keeps every
    # other brand current -- one stale island nobody would notice going wrong.
    active: false
    name: Zara Home
    website: https://www.zarahome.com
    tier: 2
    categories: [home_textile, decoration, tableware, home_accessories]
    locator: {kind: none}

  - slug: enza-home
    name: Enza Home
    website: https://www.enzahome.com
    tier: 2
    categories: [furniture, bedding]
    locator:
      kind: json
      urls:
        - https://api.yatas.com.tr/occ/v2/yatas/stores?fields=FULL&pageSize=2000
        - https://api.yatas.com.tr/occ/v2/enza/stores?fields=FULL&pageSize=2000
      list: stores
      id: name
      name: displayName
      address: address.streetname
      city: address.city.name
      district: address.county.name
      latitude: geoPoint.latitude
      longitude: geoPoint.longitude
      require: '(^| )EH( |$)'

  - slug: alfemo
    name: Alfemo
    website: https://www.alfemo.com.tr
    tier: 2
    categories: [furniture, bedding]
    locator:
      kind: html
      # Every shop is already in the page; the province dropdown only hides the rest. The
      # town is on the row as "province/district", which is better evidence than reading it
      # back out of the address -- and there is no coordinate, so that is what places them.
      url: https://www.alfemo.com/magazalarimiz
      row: '(?s)(<div class="store-accordion-item" data-target="[^"]*".*?Adres:\s*</b>\s*[^<]+)'
      name: '<div class="left">([^<]+)</div>'
      city: 'data-target="([^"/]*)'
      district: 'data-target="[^"/]*/([^"]*)"'
      address: '(?s)Adres:\s*</b>\s*([^<]+)'

  - slug: weltew
    name: Weltew Home
    website: https://www.weltewhome.com
    tier: 2
    categories: [furniture, bedding]
    locator:
      kind: html
      # Weltew writes its coordinates with a comma for the decimal separator on one
      # attribute and a point on the maps link beside it; the attributes are read, and the
      # comma is handled where every Turkish page's is.
      url: https://www.weltew.com/tr/magazalar
      row: '(?s)(<div class="item servicePoints" id="servicePoint[0-9]+">.*?data-longitude="[0-9,.]+")'
      id: 'id="servicePoint([0-9]+)"'
      name: 'onclick="focusMarker\([0-9]+\)">([^<]+)</a>'
      address: '(?s)<div class="cont"><p>([^<]+)</p>'
      phone: 'TELEFON:\s*<a href="tel:([^"]+)"'
      latitude: 'data-latitude="([0-9,.]+)"'
      longitude: 'data-longitude="([0-9,.]+)"'

  - slug: nurus
    # Contract furniture -- offices and public buildings -- rather than a home and living
    # chain anybody shops at. Out of scope for this catalogue.
    active: false
    name: Nurus
    website: https://www.nurus.com
    tier: 2
    categories: [furniture]
    locator: {kind: none}

  - slug: merinos
    name: Merinos Halı
    website: https://www.merinos.com.tr
    tier: 2
    categories: [carpet, home_textile]
    locator:
      kind: html
      # Each dealer is a list item carrying its point on the button that opens the map, and
      # its town as "District / PROVINCE" on the line under the street. Read from the markup
      # rather than out of the address, because the address is one run of text with line
      # breaks in it and the town is the half that matters.
      url: https://www.merinos.com.tr/storelocation
      row: '(?s)(<li class=nav-item role=presentation><b>.*?data-longitude=[0-9.]+)'
      name: '<b>([^<]+)</b>'
      address: '(?s)<span class=map-text-details>(.*?)</span>'
      district: '<br>\s*([^<>/]+?)\s*/'
      city: '/\s*([A-ZÇĞİÖŞÜ][^<>]*?)\s*<br>'
      latitude: 'data-latitude=([0-9.]+)'
      longitude: 'data-longitude=([0-9.]+)'

  - slug: ipek-hali
    name: İpek Halı
    website: https://www.ipekhali.com.tr
    tier: 2
    categories: [carpet]
    locator: {kind: none}

  - slug: dinarsu
    name: Dinarsu
    website: https://www.dinarsu.com.tr
    tier: 2
    categories: [carpet]
    locator:
      kind: json
      # WordPress: one address for every endpoint, told apart by a form field. The shop list
      # is asked for per city and per type -- Dinarsu separates its own shops from its
      # dealers' -- so both types are fetched and pooled.
      method: post
      over:
        url: https://dinarsu.com.tr/wp-admin/admin-ajax.php
        method: post
        body: action=get_ajax_cities
        field: term_id
      urls:
        - https://dinarsu.com.tr/wp-admin/admin-ajax.php
        - https://dinarsu.com.tr/wp-admin/admin-ajax.php
      body: action=get_ajax_addresses&type=1&is_dealer=0&city_id={over}&district_id=
      id: ID
      name: title
      address: address
      phone: phone
      latitude: latitude
      longitude: longitude

  - slug: padisah-hali
    name: Padişah Halı
    website: https://www.padisahhali.com
    tier: 2
    categories: [carpet]
    locator: {kind: none}

  - slug: neva-home
    name: Neva Home
    website: https://www.nevahome.com
    tier: 2
    categories: [home_textile, bedding]
    locator: {kind: none}

  - slug: pierre-cardin-home
    # The home brand publishes no store list; the bedding brand does, at its own domain, and
    # that is the network these shops belong to.
    name: Pierre Cardin Yatak
    website: https://www.pierrecardinhome.com.tr
    tier: 2
    categories: [home_textile, bedding, decoration]
    locator:
      kind: html
      # The province and district are attributes on the card, which is better evidence than
      # reading them back out of the address.
      url: https://pierrecardinyatak.com.tr/satis-noktalari/
      row: '(?s)(<div class="wpgmp-card" data-prov=.*?</p>)'
      name: '<h3>([^<]+)</h3>'
      city: 'data-prov="([^"]*)"'
      district: 'data-dist="([^"]*)"'
      address: '<small>[^A-Za-zÇĞİÖŞÜçğıöşü0-9]*([^<]+)</small>'
      coordinates: 'maps\?q=([0-9.]+,[0-9.]+)'

  - slug: emsan
    name: Emsan
    website: https://www.emsan.com.tr
    tier: 2
    categories: [kitchenware, tableware, small_appliances]
    locator:
      kind: json
      # Emsan is Karaca's group and runs the same platform, so the same mapping reads it:
      # one JSON object per shop in its own hidden div.
      url: https://www.emsan.com.tr/magazalarimiz
      extract: 'class="store-find-change-map\d+">(\{.*?\})</div>'
      id: store_id
      name: name
      address: address
      city: city
      district: state
      phone: phone
      latitude: lat
      longitude: lng

  - slug: korkmaz
    name: Korkmaz
    website: https://www.korkmaz.com.tr
    tier: 2
    categories: [kitchenware, tableware, small_appliances]
    locator:
      kind: html
      # Korkmaz lists its forty shops in the page with no coordinates; each address ends with
      # its town and province, which is what places them.
      url: https://www.korkmazstore.com.tr/satis-noktalarimiz
      row: '(?s)(<div id="store-title-[0-9]+".*?<div class="content-store">[^<]*)'
